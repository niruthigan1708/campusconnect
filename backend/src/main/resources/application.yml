spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: campusconnect-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusconnect}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing databases (created back when ddl-auto=update owned the schema) are
    # marked as already being at V1 instead of re-running it from scratch; only a
    # genuinely empty database executes V1__init_schema.sql for real.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Flyway (db/migration) owns the schema now; Hibernate only verifies the
      # mapped entities match what Flyway created instead of auto-patching it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-your-env-file-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  admin:
    name: ${ADMIN_NAME:Platform Admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    # Comma-separated list of allowed origins for the frontend.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  password-reset:
    expiration-ms: ${PASSWORD_RESET_EXPIRATION_MS:1800000}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  mail:
    # "From" address for outgoing mail. Only used if MAIL_HOST is actually set -
    # see MailService, which falls back to logging the content when it isn't.
    from: ${MAIL_FROM:no-reply@campusconnect.edu}
  # When true, seeds a full set of demo clubs/events/registrations on startup if
  # the database is empty. See DemoDataSeeder.
  seed-demo-data: ${SEED_DEMO_DATA:false}
