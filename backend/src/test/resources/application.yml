# Shadows src/main/resources/application.yml for tests. The DataSource comes
# from the Testcontainers PostgreSQL (see TestcontainersConfiguration), so the
# schema is built by the real Flyway migrations and checked by Hibernate
# exactly as in production - previously tests used H2 with Flyway disabled,
# so migrations were never exercised.
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  mail:
    # Must be present (even empty) for MailSenderAutoConfiguration to create a
    # JavaMailSender bean - MailService needs one to be injectable in tests.
    host: ""

# Mirrors the production default in src/main/resources/application.yml (this
# file shadows it), so ApiSecurityIntegrationTest checks the docs stay hidden.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

app:
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-testing-purpose-only
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  admin:
    name: Test Admin
    email: testadmin@campusconnect.edu
    password: Password123!
  cors:
    allowed-origins: http://localhost:3000
  frontend-url: http://localhost:3000
  password-reset:
    expiration-ms: 1800000
  uploads:
    dir: target/test-uploads
  mail:
    from: test@campusconnect.edu
  seed-demo-data: false
  events:
    # Tests call EventCompletionScheduler directly; keep the background run out of the way.
    completion-check-initial-delay-ms: 3600000
