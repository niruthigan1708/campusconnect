# Optional: a containerized Postgres for developers who don't want to install
# Postgres natively. This is NOT required if you already have Postgres running
# locally (e.g. as a Windows/Mac service) - just point backend/.env at that
# instead, as this project currently does.
#
# If you DO use this: run `docker compose up -d`, then set these in
# backend/.env to match:
#   DB_HOST=localhost
#   DB_PORT=5432
#   DB_NAME=campusconnect
#   DB_USERNAME=postgres
#   DB_PASSWORD=postgrespassword
services:
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
